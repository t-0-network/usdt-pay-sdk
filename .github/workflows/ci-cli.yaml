name: CI / Unified CLI

# Proves that the CLI builds, its tests pass, and `usdt-pay init` produces a
# working standalone project for every starter: scaffolds each embedded
# lang/role with the built binary, checks essential files, then builds and runs
# each scaffold's own tests against the SDKs built from this tree. SDK and
# proto changes are inputs of this workflow too, not only the starters and the
# CLI.
on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - "go/**"
      - "java/**"
      - "node/**"
      - "python/**"
      - "proto/**"
      - ".github/workflows/ci-cli.yaml"
  pull_request:
    branches: [master]
    paths:
      - "cli/**"
      - "go/**"
      - "java/**"
      - "node/**"
      - "python/**"
      - "proto/**"
      - ".github/workflows/ci-cli.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Build & Scaffold Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync templates (go generate)
        working-directory: cli
        run: go generate ./...

      - name: Build CLI
        working-directory: cli
        run: go build -ldflags "-X main.Version=dev" -o ../usdt-pay .

      - name: Run tests
        working-directory: cli
        run: go test -v ./...

      # A scaffolded project pins the *published* SDK, which lags this tree between a
      # proto sync and the next release — so the starter is built against the SDK in
      # this tree instead: Java from an isolated mavenLocal under a version that is
      # not published anywhere, Node from a packed tarball. No registry dependency for
      # the SDK, so this runs on every event, release commits included.
      - name: Pack Node SDK for scaffold test
        working-directory: node
        run: |
          npm ci --silent
          npm run build -w sdk --silent
          npm pack -w sdk --silent --pack-destination "${RUNNER_TEMP}"
          ls "${RUNNER_TEMP}"/t-0-usdt-pay-sdk-*.tgz

      - name: Publish this tree's Java SDK locally
        run: |
          set -euo pipefail
          (cd java && ./gradlew :sdk:publishToMavenLocal --no-daemon -q -Pversion=0.0.0-local -Dmaven.repo.local="${RUNNER_TEMP}/m2")
          test -d "${RUNNER_TEMP}/m2/network/t-0/usdt-pay-sdk-java/0.0.0-local"
          printf 'allprojects { repositories { mavenLocal() } }\n' > "${RUNNER_TEMP}/mavenlocal.init.gradle"

      - name: Build Python SDK wheel for scaffold test
        run: |
          (cd python && uv build --package t0-usdt-pay-sdk -o "${RUNNER_TEMP}/pydist")
          ls "${RUNNER_TEMP}"/pydist/t0_usdt_pay_sdk-*.whl

      # Scaffold each starter and build+test against this tree's SDK.
      # Structural checks (essential files, .env keypair, permissions) are
      # covered by `go test` above — these steps prove the scaffolded project
      # compiles and its tests pass against an unreleased SDK.
      - name: Scaffold and test Java acquirer
        run: |
          ./usdt-pay init test-java --lang=java --role=acquirer --no-color --dir=test-java
          (cd test-java && ./gradlew test --no-daemon -q \
            --init-script "${RUNNER_TEMP}/mavenlocal.init.gradle" \
            -Dmaven.repo.local="${RUNNER_TEMP}/m2" \
            -PusdtPaySdkVersion=0.0.0-local)

      - name: Scaffold and test Node issuer
        run: |
          ./usdt-pay init test-node-issuer --lang=node --role=issuer --no-color --dir=test-node-issuer
          (cd test-node-issuer && npm install --silent --no-save --package-lock=false --no-audit --no-fund "${RUNNER_TEMP}"/t-0-usdt-pay-sdk-*.tgz && npm run build && npm test)

      - name: Scaffold and test Node lp
        run: |
          ./usdt-pay init test-node-lp --lang=node --role=lp --no-color --dir=test-node-lp
          (cd test-node-lp && npm install --silent --no-save --package-lock=false --no-audit --no-fund "${RUNNER_TEMP}"/t-0-usdt-pay-sdk-*.tgz && npm run build && npm test)

      - name: Scaffold and test Python acquirer
        run: |
          ./usdt-pay init test-python --lang=python --role=acquirer --no-color --dir=test-python
          (cd test-python && uv add --no-sync "${RUNNER_TEMP}"/pydist/t0_usdt_pay_sdk-*.whl && uv sync && uv run pytest)

      - name: Scaffold and test Go acquirer
        run: |
          ./usdt-pay init test-go --lang=go --role=acquirer --module=github.com/test/test-go --no-color --dir=test-go
          test -f test-go/go.mod && test -f test-go/.env && test -f test-go/.gitignore
          VERSION=$(grep 'usdt-pay-sdk/go/sdk v' test-go/go.mod | awk '{print $2}')
          PROXY_DIR="${RUNNER_TEMP}/goproxy"
          go -C .github/tools/sumtool run . "${GITHUB_WORKSPACE}/go/sdk" "${VERSION}" "${PROXY_DIR}"
          cd test-go
          sed -i '/usdt-pay-sdk\/go\/sdk /d' go.sum
          export GOMODCACHE="${RUNNER_TEMP}/template-modcache"
          export GONOSUMDB="github.com/t-0-network"
          GOPROXY="file://${PROXY_DIR}" go mod download "github.com/t-0-network/usdt-pay-sdk/go/sdk@${VERSION}"
          export GOPROXY="file://${PROXY_DIR},https://proxy.golang.org,direct"
          go mod tidy
          go build ./... && go test ./...

  cli-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Sync templates (go generate)
        working-directory: cli
        run: go generate ./...

      - name: Build CLI
        working-directory: cli
        run: go build -ldflags "-X main.Version=dev" -o ../usdt-pay.exe .

      - name: Run tests
        working-directory: cli
        run: go test -v ./...

      - name: Scaffold Node projects
        shell: pwsh
        run: |
          ./usdt-pay.exe init test-node-issuer --lang=node --role=issuer --no-color --dir=test-node-issuer
          if (!(Test-Path test-node-issuer/package.json)) { exit 1 }
          if (!(Test-Path test-node-issuer/.env)) { exit 1 }
          if (!(Test-Path test-node-issuer/.gitignore)) { exit 1 }
          ./usdt-pay.exe init test-node-lp --lang=node --role=lp --no-color --dir=test-node-lp
          if (!(Test-Path test-node-lp/package.json)) { exit 1 }
          if (!(Test-Path test-node-lp/.env)) { exit 1 }
          if (!(Test-Path test-node-lp/.gitignore)) { exit 1 }

      - name: Scaffold Go acquirer
        shell: pwsh
        run: |
          ./usdt-pay.exe init test-go --lang=go --role=acquirer --module=github.com/test/test-go --no-color --dir=test-go
          if (!(Test-Path test-go/go.mod)) { exit 1 }
          if (!(Test-Path test-go/.env)) { exit 1 }
          if (!(Test-Path test-go/.gitignore)) { exit 1 }
