name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Compiles the SDK (buf generates the stubs first), runs the starter's tests,
      # and builds usdt-pay-init.jar with the starter packed into it.
      - name: Build
        working-directory: java
        run: ./gradlew build --no-daemon

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install
        working-directory: node
        run: npm ci

      - name: Build
        working-directory: node
        run: npm run build

      - name: Typecheck
        working-directory: node
        run: npm run typecheck

      - name: Test
        working-directory: node
        run: npm test

      - name: Audit runtime dependencies
        working-directory: node
        run: npm audit --omit=dev --audit-level=high
