name: CI / Go

on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - "java/starter/**"
      - "node/starter/**"
      - ".github/workflows/ci-go.yaml"
  pull_request:
    branches: [master]
    paths:
      - "cli/**"
      - "java/starter/**"
      - "node/starter/**"
      - ".github/workflows/ci-go.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Generate templates
        working-directory: cli
        run: go generate ./...

      - name: Build
        working-directory: cli
        run: go build ./...

      - name: Test
        working-directory: cli
        run: go test ./...

      - name: Build CLI binary
        working-directory: cli
        run: go build -ldflags "-X main.Version=dev" -o ../usdt-pay .

      # Every embedded lang/role (cli/internal/embed/<lang>/<role>, produced by
      # go generate): scaffold it with the built binary and require every file of
      # cli/overlay/<lang>/<role> to land byte for byte. Needs no registry, so it
      # runs on every event — a bot sync that drops the overlay seam fails here.
      - name: Scaffold every starter and verify the overlay landed
        run: |
          set -euo pipefail
          for dir in cli/internal/embed/*/*/; do
            lang=$(basename "$(dirname "$dir")")
            role=$(basename "$dir")
            out="scaffold-${lang}-${role}"
            ./usdt-pay init "test-${lang}-${role}" --lang="$lang" --role="$role" --no-color --dir="$out"
            test -f "$out/.gitignore"
            grep -q 'PROVIDER_PRIVATE_KEY=0x' "$out/.env"
            test -d "cli/overlay/${lang}/${role}" || { echo "::error::no cli/overlay/${lang}/${role} — the in-repo Dockerfile cannot ship standalone"; exit 1; }
            (cd "cli/overlay/${lang}/${role}" && find . -type f) | sed 's|^\./||' | while read -r f; do
              cmp "cli/overlay/${lang}/${role}/${f}" "${out}/${f}"
            done
            echo "ok: ${lang}/${role}"
          done

      - name: Setup Java
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        if: github.event_name == 'pull_request'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The scaffolded project pins the published SDK version, which does not
      # exist yet on a release commit (publish runs in parallel) — PRs only.
      # A new language needs a case here; the loop fails loudly without one.
      - name: Compile every scaffolded starter against the published SDK
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for dir in cli/internal/embed/*/*/; do
            lang=$(basename "$(dirname "$dir")")
            role=$(basename "$dir")
            out="scaffold-${lang}-${role}"
            case "$lang" in
              java) (cd "$out" && ./gradlew compileJava --no-daemon) ;;
              node) (cd "$out" && npm install --silent --no-audit --no-fund && npm run build) ;;
              *) echo "::error::no compile-verify case for lang=${lang} — add one to this step"; exit 1 ;;
            esac
            echo "ok: ${lang}/${role} compiles"
          done
