name: Publish

# Stage 2 of 2, triggered by the tag release.yaml pushes. Never run this by hand:
# every registry it touches is immutable. See docs/RELEASE_AND_PUBLISH.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# npm through OIDC, Java through Maven Central credentials, CLI through the App token.
# Only publish-cli needs contents: write (for release asset upload); the others are read-only.
permissions:
  contents: read

jobs:
  # Every publish job needs this one, so a missing prerequisite for *either* registry
  # stops *both*. Per-job preflights would not: publish-java would happily spend the
  # Maven Central version while publish-node was still failing its repo-visibility
  # check, and Central cannot be un-spent.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      # npm returns 422 "Only public source repositories are supported" for provenance
      # from a private repo — and only after the build.
      - name: Repository must be public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIVATE=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          [ "$PRIVATE" = "false" ] || {
            echo "::error::${GITHUB_REPOSITORY} is private; npm rejects --provenance from private source repositories"
            exit 1
          }
          echo "${GITHUB_REPOSITORY} is public"

      # Secrets cannot be read in `if:`, so this is a run step. Values are only tested
      # for emptiness, never echoed.
      - name: Maven Central credentials must be present
        env:
          MAVEN_CENTRAL_USERNAME: ${{ vars.OSSRH_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          ERRORS=0
          [ -n "$MAVEN_CENTRAL_USERNAME" ] || { echo "::error::vars.OSSRH_USERNAME is empty"; ERRORS=$((ERRORS + 1)); }
          [ -n "$MAVEN_CENTRAL_PASSWORD" ] || { echo "::error::secrets.OSSRH_PASSWORD is empty"; ERRORS=$((ERRORS + 1)); }
          [ -n "$GPG_PRIVATE_KEY" ]        || { echo "::error::secrets.GPG_PRIVATE_KEY is empty"; ERRORS=$((ERRORS + 1)); }
          [ "$ERRORS" -eq 0 ] || exit 1
          echo "Maven Central credentials present"

      # A trusted publisher can only be attached to a package that already exists on
      # the registry, so the first version has to be published by hand. Until that
      # bootstrap has happened this job cannot authenticate at all — and without this
      # check the failure lands *after* publish-java has spent the version on Maven
      # Central, which is permanent. See docs/RELEASE_AND_PUBLISH.md.
      - name: npm package must already exist
        run: |
          ERRORS=0
          for PKG in @t-0/usdt-pay-sdk; do
            # `versions`, not `version`: the question is whether the package exists,
            # and `version` answers a different one — what its `latest` dist-tag
            # resolves to. They coincide today only because npm sets `latest` on a
            # package's first publish whatever `--tag` says.
            #
            # Only a 404 means "not published". Anything else — a registry 5xx, DNS,
            # or the CDN briefly serving 404 for a package that was just published —
            # is a different failure, and reporting it as "does not exist" would send
            # an operator off to redo a bootstrap that is already done.
            if ERR=$(npm view "$PKG" versions 2>&1 >/dev/null); then
              echo "$PKG is on the registry"
            elif printf '%s' "$ERR" | grep -q 'E404'; then
              echo "::error::$PKG does not exist on npm — run the one-time bootstrap in docs/RELEASE_AND_PUBLISH.md before releasing"
              ERRORS=$((ERRORS + 1))
            else
              echo "::error::could not reach the npm registry for $PKG — this is not a missing package: $ERR"
              ERRORS=$((ERRORS + 1))
            fi
          done
          [ "$ERRORS" -eq 0 ] || exit 1

  # --- Build gate: ci.yaml's three jobs, minus `npm audit`. Deliberate — post-tag, an
  # advisory published in the minutes between tag and publish would strand a tagged
  # release that cannot be re-cut without a dependency bump. Pre-tag it still blocks. ---
  build-java:
    name: Build Java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build
        working-directory: java
        run: ./gradlew build --no-daemon

  build-node:
    name: Build Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install
        working-directory: node
        run: npm ci

      - name: Build
        working-directory: node
        run: npm run build

      - name: Typecheck
        working-directory: node
        run: npm run typecheck

      - name: Test
        working-directory: node
        run: npm test

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Generate templates
        working-directory: cli
        run: go generate ./...

      - name: Build
        working-directory: cli
        run: go build ./...

      - name: Test
        working-directory: cli
        run: go test ./...

  publish-node-sdk:
    name: Publish Node SDK
    needs: [preflight, build-java, build-node, build-go]
    # npm rejects --provenance from self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
        # No registry-url on purpose: that wires up a NODE_AUTH_TOKEN path which must
        # not exist here. Auth is OIDC via the package's trusted publisher.

      # Node 22 bundles npm 10.x, which has no OIDC support at all. Pinned to the 11
      # major rather than @latest: a future npm 12 could raise its Node floor above 22
      # and break this job on a day nobody touched the repo.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          NPM_VERSION=$(npm -v)
          echo "npm $NPM_VERSION"
          printf '11.5.1\n%s\n' "$NPM_VERSION" | sort -V -C || {
            echo "::error::npm $NPM_VERSION < 11.5.1, trusted publishing unsupported"
            exit 1
          }

      - name: Verify version matches tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./node/sdk/package.json').version")
          [ "$PKG" = "$VERSION" ] || { echo "::error::node/sdk/package.json has $PKG, tag is v$VERSION"; exit 1; }
          echo "node/sdk/package.json version $PKG matches tag v$VERSION"

      # The lockfile lives at the workspace root, not in sdk/.
      - name: Install
        working-directory: node
        run: npm ci

      - name: Build
        working-directory: node
        run: |
          npm run build -w sdk
          npm run typecheck -w sdk

      # Explicit so no future refactor can point this at the private workspace root or
      # at the issuer starter. npm refuses "private": true anyway, but the assert
      # is what makes it reviewable.
      - name: Verify the package about to be published
        working-directory: node/sdk
        run: |
          NAME=$(node -p "require('./package.json').name")
          PRIVATE=$(node -p "String(require('./package.json').private)")
          [ "$NAME" = "@t-0/usdt-pay-sdk" ] || { echo "::error::expected @t-0/usdt-pay-sdk, got $NAME"; exit 1; }
          case "$PRIVATE" in
            undefined|false) ;;
            *) echo "::error::$NAME is marked private"; exit 1 ;;
          esac

      - name: Pack (dry run)
        working-directory: node/sdk
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: node/sdk
        run: npm publish --provenance --access public

  publish-java:
    name: Publish Java
    needs: [preflight, build-java, build-node, build-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Central will not let you replace a version, so a tag that disagrees with
      # the version sites has to fail here rather than half-way through the upload.
      - name: Verify version matches tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ERRORS=0
          PKG=$(grep '^version=' java/gradle.properties | cut -d= -f2)
          [ "$PKG" = "$VERSION" ] || { echo "::error::java/gradle.properties has $PKG, tag is v$VERSION"; ERRORS=$((ERRORS + 1)); }
          SDK=$(grep -oP '(?<=SDK_VERSION = \")[^\"]+' java/sdk/src/main/java/network/t0/pay/server/Version.java)
          [ "$SDK" = "$VERSION" ] || { echo "::error::Version.java has $SDK, tag is v$VERSION"; ERRORS=$((ERRORS + 1)); }
          SDK_PIN=$(grep '^usdtPaySdkVersion=' java/starter/acquirer/gradle.properties | cut -d= -f2)
          [ "$SDK_PIN" = "$VERSION" ] || { echo "::error::java/starter/acquirer/gradle.properties has usdtPaySdkVersion=$SDK_PIN, tag is v$VERSION"; ERRORS=$((ERRORS + 1)); }
          [ "$ERRORS" -eq 0 ] || exit 1
          echo "Java version sites match tag v$VERSION"

      - name: Build
        working-directory: java
        run: ./gradlew build --no-daemon

      - name: Publish to Maven Central
        working-directory: java
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_USERNAME: ${{ vars.OSSRH_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}

  publish-cli:
    name: Publish CLI
    needs: [preflight, build-java, build-node, build-go]
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: usdt-pay-sdk
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Sync templates
        working-directory: cli
        run: go generate ./...

      - name: Cross-compile
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LDFLAGS="-X main.Version=${VERSION}"
          mkdir -p ../dist
          PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for PLATFORM in $PLATFORMS; do
            OS="${PLATFORM%/*}"
            ARCH="${PLATFORM#*/}"
            EXT=""
            if [ "$OS" = "windows" ]; then EXT=".exe"; fi
            OUTPUT="usdt-pay-${OS}-${ARCH}${EXT}"
            echo "Building $OUTPUT..."
            GOOS="$OS" GOARCH="$ARCH" go build -ldflags "$LDFLAGS" -o "../dist/${OUTPUT}" .
          done

      - name: Upload CLI binaries to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            gh release view "v${VERSION}" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "v${VERSION}" >/dev/null 2>&1 \
            || gh release create "v${VERSION}" --verify-tag --generate-notes --title "${VERSION}" \
            || gh release view "v${VERSION}" >/dev/null
          gh release upload "v${VERSION}" dist/usdt-pay-* --clobber
