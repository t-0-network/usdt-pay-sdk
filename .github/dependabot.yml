version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/node"
    schedule:
      interval: "weekly"
    groups:
      connectrpc:
        patterns:
          - "@connectrpc/*"
      bufbuild:
        patterns:
          - "@bufbuild/*"

  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/java"
    schedule:
      interval: "weekly"
