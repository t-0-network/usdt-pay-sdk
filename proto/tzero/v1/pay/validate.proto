syntax = "proto2";

// Reusable protovalidate predefined rules for on-chain identifiers.
// Proto2 syntax is required for `extend buf.validate.StringRules`.

package tzero.v1.pay;

import "buf/validate/validate.proto";

extend buf.validate.StringRules {
  // Shape of an on-chain transaction hash across supported chains: 32 bytes of
  // hex, spelled bare (TRON) or with the 0x prefix (EVM).
  optional bool valid_tx_hash = 50001 [(buf.validate.predefined).cel = {
    id: "string.valid_tx_hash"
    expression: "this.matches('^(0x)?[0-9a-fA-F]{64}$') ? '' : 'must be 64 hex characters, optionally 0x-prefixed'"
  }];

  // Length bound for on-chain wallet addresses across supported chains.
  // Shortest: TRON base58 (34). Longest: EVM / TRON hex (42).
  optional bool valid_address = 50002 [(buf.validate.predefined).cel = {
    id: "string.valid_address"
    expression: "this.size() >= 34 && this.size() <= 42 ? '' : 'must be 34-42 characters'"
  }];
}
