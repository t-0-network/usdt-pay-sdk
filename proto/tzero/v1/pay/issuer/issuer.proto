syntax = "proto3";

// The Issuer ↔ t-0 edge:
// IssuerService is hosted by t-0 and called by the Issuer;
// IssuerCallbackService is implemented by the Issuer and called by t-0.

package tzero.v1.pay.issuer;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "tzero/v1/pay/common.proto";

/**
 * t-0 endpoints the Issuer calls to report what it did with a customer deposit
 * and the USDt settlements that clear the intents it covers.
 */
service IssuerService {
  /** Reports a deposit seen on-chain against an intent and the Issuer's final disposition of it. */
  rpc PaymentReceived(PaymentReceivedRequest) returns (PaymentReceivedResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  /** Reports a USDt settlement sent on-chain to the registered destination, for t-0 to verify. */
  rpc SettlementSent(SettlementSentRequest) returns (SettlementSentResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

/**
 * Issuer-implemented endpoint t-0 calls to reserve deposit addresses and obtain
 * the renderable QR payloads for an intent.
 */
service IssuerCallbackService {
  /** Reserves one deposit address per supported chain and returns the renderable QR payloads. */
  rpc CreatePaymentInstructions(CreatePaymentInstructionsRequest) returns (CreatePaymentInstructionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// ── IssuerService ────────────────────────────────────────────────────

message PaymentReceivedRequest {
  /** Intent the deposit was made against. */
  uint64 payment_intent_id = 10 [(buf.validate.field).uint64.gt = 0];

  /** Amount the deposit actually credited, on either outcome. */
  tzero.v1.pay.Decimal amount_usdt = 20 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      message: "amount_usdt must be greater than zero"
      expression: "this.unscaled > 0"
    }
  ];

  /** The payment instrument; the MVP's only variant is usdt_on_chain. */
  oneof payment_method {
    option (buf.validate.oneof).required = true;
    tzero.v1.pay.UsdtOnChainPayment usdt_on_chain = 30;
  }

  /** Moment the Issuer observed the deposit as final on-chain. */
  google.protobuf.Timestamp received_at = 40 [(buf.validate.field).required = true];

  /**
   * The Issuer's final disposition of the deposit. Screening is complete before
   * the call; a deposit still being screened is not reported at all.
   */
  oneof outcome {
    option (buf.validate.oneof).required = true;
    Authorized authorized = 50;
    Unprocessable unprocessable = 60;
  }

  /**
   * The deposit passed the Issuer's screening. Once t-0 accepts the report the
   * Issuer owns the on-chain risk and is obligated to settle the intent.
   */
  message Authorized {}

  /**
   * The Issuer will not process the deposit and the intent ends failed. The
   * disposition says where the funds go and is final when reported.
   */
  message Unprocessable {
    tzero.v1.pay.FundsDisposition disposition = 10 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
  }
}

message PaymentReceivedResponse {
  /**
   * Accepted records the report as the intent's disposition (authorized →
   * AUTHORIZED, unprocessable → FAILED), or replays a disposition already
   * on file. Rejected means the report was not recorded: for an authorized
   * report the deposit is refunded to sender_address; for an unprocessable
   * report the funds follow the reported disposition.
   */
  oneof result {
    option (buf.validate.oneof).required = true;
    Accepted accepted = 10;
    Rejected rejected = 20;
  }

  /** The disposition is recorded. */
  message Accepted {}

  /** The report was not recorded. */
  message Rejected {
    Reason reason = 10 [(buf.validate.field).enum.not_in = 0];

    enum Reason {
      REASON_UNSPECIFIED = 0;
      // Processing started after expires_at on t-0's clock.
      REASON_INTENT_EXPIRED = 10;
      // No such intent exists.
      REASON_UNKNOWN_INTENT = 20;
      // amount_usdt is not exactly the intent's stored amount.
      REASON_AMOUNT_MISMATCH = 30;
      // The transfer is already another intent's recorded deposit; no refund or
      // disposition action follows — reconciled out of band.
      REASON_TRANSFER_RECORDED_FOR_ANOTHER_INTENT = 40;
    }
  }
}

message SettlementSentRequest {
  /** Issuer's id for this USDt settlement; idempotency key, unique per Issuer. */
  string settlement_ref = 10 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];

  /** Total USDt settled across the covered intents. */
  tzero.v1.pay.Decimal amount_usdt = 20 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      message: "amount_usdt must be greater than zero"
      expression: "this.unscaled > 0"
    }
  ];

  /** On-chain transaction, chain, and registered destination wallet for this settlement. */
  tzero.v1.pay.OnChainSettlementDetails settlement = 30 [(buf.validate.field).required = true];

  /** Intents this settlement clears, treated as a set; per-intent amounts come from t-0's ledger. */
  repeated uint64 settled_payment_intent_ids = 40 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.uint64 = {
      gt: 0
      lte: 9223372036854775807
    }
  ];

  /** Moment the Issuer broadcast the settlement transaction. */
  google.protobuf.Timestamp settled_at = 50 [(buf.validate.field).required = true];
}

message SettlementSentResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    Accepted accepted = 10;
    Rejected rejected = 20;
  }

  message Accepted {}

  /**
   * The settlement is not recorded. ON_CHAIN_UNCONFIRMED clears on its own and
   * the report is resubmitted under the same settlement_ref once the transaction
   * confirms; the other reasons open a manual reconciliation with t-0, and the
   * corrected report follows from it.
   */
  message Rejected {
    Reason reason = 10 [(buf.validate.field).enum.not_in = 0];

    enum Reason {
      REASON_UNSPECIFIED = 0;
      // The on-chain transaction is not yet confirmed. Not returned while t-0 accepts unverified.
      REASON_ON_CHAIN_UNCONFIRMED = 10;
      // The confirmed amount does not equal amount_usdt or the covered intents' sum.
      REASON_AMOUNT_MISMATCH = 20;
      // destination_address (or its chain) is not the expected registered (chain, address) pair for the mode.
      REASON_WRONG_DESTINATION = 30;
      // A listed intent is unknown, not authorized, or already covered. Fiat mode also accepts a
      // settled intent, whose Acquirer confirmation may land before this reimbursement.
      REASON_INTENT_NOT_SETTLEABLE = 40;
      // This on-chain transfer is already recorded under a different settlement_ref.
      REASON_SETTLEMENT_REF_CONFLICT = 50;
    }
  }
}

// ── IssuerCallbackService ───────────────────────────────────────────────────

message CreatePaymentInstructionsRequest {
  /** Intent the deposit addresses are reserved for. */
  uint64 payment_intent_id = 10 [(buf.validate.field).uint64.gt = 0];

  /** t-0's stable id for the Acquirer; the Issuer resolves its settlement wallet from it. */
  uint64 acquirer_id = 20 [(buf.validate.field).uint64.gt = 0];

  /** Amount the reserved addresses should accept. */
  tzero.v1.pay.Decimal amount_usdt = 30 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      message: "amount_usdt must be greater than zero"
      expression: "this.unscaled > 0"
    }
  ];

  /**
   * Absolute moment t-0 requires the reservation held until, on t-0's clock.
   * t-0 sizes the window per intent rather than to a fixed value.
   */
  google.protobuf.Timestamp expires_at = 40 [(buf.validate.field).timestamp.gt_now = true];
}

message CreatePaymentInstructionsResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    Success success = 10;
    Failure failure = 20;
  }

  message Success {
    /** One option per chain the Issuer supports for this intent. */
    repeated tzero.v1.pay.QrOption qr_options = 10 [(buf.validate.field).repeated = {min_items: 1}];

    /** Absolute expiry of the reservation; at or after the commanded expires_at. */
    google.protobuf.Timestamp expires_at = 20 [(buf.validate.field).required = true];
  }

  message Failure {
    Reason reason = 10 [(buf.validate.field).enum.not_in = 0];

    enum Reason {
      REASON_UNSPECIFIED = 0;
      // The Issuer is unavailable to allocate.
      REASON_ISSUER_UNAVAILABLE = 10;
      // No free one-time deposit addresses.
      REASON_ADDRESS_POOL_EMPTY = 20;
      // The amount falls outside the acceptable range.
      REASON_AMOUNT_OUT_OF_RANGE = 40;
    }
  }
}
