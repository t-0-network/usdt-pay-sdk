syntax = "proto3";

// Types shared across the pay contract's three role edges.

package tzero.v1.pay;

import "buf/validate/validate.proto";
import "tzero/v1/pay/validate.proto";

/**
 * Fixed-point monetary amount: unscaled * 10^exponent, so 123.45 is
 * unscaled=12345, exponent=-2.
 */
message Decimal {
  // no validation: sign and magnitude are constrained per field by the predicate on the enclosing amount.
  int64 unscaled = 10;

  int32 exponent = 20 [(buf.validate.field).int32 = {
    gte: -8
    lte: 8
  }];
}

/**
 * On-chain network a USDt transfer moves over. Live at launch: ETH and BSC.
 * TRON already carries a value but is not accepted until it goes live in a
 * later phase; Arbitrum, Polygon and Avalanche are added as they go live.
 */
enum Blockchain {
  BLOCKCHAIN_UNSPECIFIED = 0;
  BLOCKCHAIN_TRON = 10;
  BLOCKCHAIN_ETH = 20;
  BLOCKCHAIN_BSC = 30;
}

/**
 * One on-chain USDt transfer made by the customer. The only payment-method
 * variant in the MVP.
 */
message UsdtOnChainPayment {
  /** Chain the customer's USDt transfer moved over. */
  Blockchain chain = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  /** Hash of the customer's USDt transfer. */
  string on_chain_tx_hash = 20 [(buf.validate.field).string.(valid_tx_hash) = true];

  /** Customer's source wallet address, for receipt and audit. */
  string sender_address = 30 [(buf.validate.field).string.(valid_address) = true];
}

/**
 * One selectable deposit option for an intent: the chain, the one-time address
 * reserved on it, and the chain-native payment URI the POS carries to the customer
 * (as a QR image, a wallet deep link, or any other carrier) without modification.
 */
message DepositOption {
  /** Chain this deposit option pays on. */
  Blockchain chain = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  /** One-time deposit address reserved for this intent on `chain`. */
  string deposit_address = 20 [(buf.validate.field).string.(valid_address) = true];

  /** Chain-native payment URI (EIP-681 on EVM chains); produced only by the Issuer and carried to the customer unchanged. */
  string payment_uri = 30 [(buf.validate.field).string = {min_len: 1}];

  /** USDt token contract on `chain` the deposit must be made in. */
  string token_contract = 40 [(buf.validate.field).string.(valid_address) = true];
}

/**
 * Where a deposit's funds end up when the payment will not settle. Final when
 * reported: whether a retained deposit is later released is decided out of band
 * and is not part of this contract.
 */
enum FundsDisposition {
  FUNDS_DISPOSITION_UNSPECIFIED = 0;
  // The Issuer returns the deposit to the customer's sender_address.
  FUNDS_DISPOSITION_RETURNED_TO_SENDER = 10;
  // The Issuer keeps the deposit; the customer resolves it with the Issuer out of band.
  FUNDS_DISPOSITION_RETAINED_BY_ISSUER = 20;
}

/**
 * One on-chain USDt settlement transfer, as reported by the Issuer on
 * SettlementSent and relayed to the Acquirer on SettlementCompleted.
 */
message OnChainSettlementDetails {
  /** Hash of the settlement transaction. */
  string on_chain_tx_hash = 10 [(buf.validate.field).string.(valid_tx_hash) = true];

  /** Chain the settlement moved over. */
  Blockchain chain = 20 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  /** Registered settlement wallet on `chain` — the Acquirer's (USDt mode) or the LP's (fiat mode). */
  string destination_address = 30 [(buf.validate.field).string.(valid_address) = true];
}
