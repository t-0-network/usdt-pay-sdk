[project]
name = "my-provider"
version = "0.1.0"
requires-python = ">=3.13"
description = "Acquirer integration for the t-0 USDt pay flow"
dependencies = [
    "t0-usdt-pay-sdk>=0.2.4",
    "uvicorn>=0.52.4",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "waitress>=3.0.2",
    "gunicorn>=23.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquirer"]
