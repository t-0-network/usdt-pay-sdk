[project]
name = "usdt-pay-python"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["sdk", "starter/acquirer"]

[tool.uv.sources]
t0-usdt-pay-sdk = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "starter/acquirer/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["sdk/src/t0_usdt_pay_sdk/api/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "UP046", "UP047", "TC001", "TC002", "TC003", "B904"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["sdk/src/t0_usdt_pay_sdk/api/"]

[dependency-groups]
dev = [
    "protoc-gen-connectrpc>=0.11.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "uvicorn>=0.52.4",
    "waitress>=3.0.2",
    "gunicorn>=23.0.0",
]
