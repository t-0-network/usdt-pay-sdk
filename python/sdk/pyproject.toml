[project]
name = "t0-usdt-pay-sdk"
version = "0.3.1"
requires-python = ">=3.13"
description = "T-0 Network USDt Pay SDK for Python"
license = "MIT"
authors = [
    { name = "T-0 Network" },
]
dependencies = [
    "t0-provider-sdk==1.3.2",
    # The version the stubs are generated with. From 0.13 `MethodInfo` requires `stream_type`, so
    # 0.12 stubs fail to import on a 0.13 runtime and 0.13 stubs on a 0.12 one.
    "connectrpc>=0.13.0",
    "protobuf>=7.36.2",
]

[project.urls]
Repository = "https://github.com/t-0-network/usdt-pay-sdk"
Homepage = "https://github.com/t-0-network/usdt-pay-sdk"
Organization = "https://pypi.org/org/t0-network/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t0_usdt_pay_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["proto", "buf.yaml", "buf.gen.yaml", "buf.lock"]
